# Change prefix from Ctrl+b to Ctrl+s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

set -g mouse on
set -g focus-events on
set -ga terminal-overrides ',*256color*:smcup@:rmcup@'
set -g history-limit 100000

# Catppuccin theme (commented out - uncomment to switch back)
# set -g @plugin 'catppuccin/tmux#v2.1.3'
# set -g @catppuccin_flavor 'mocha'

# Rose Pine theme
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main'

# Information modules
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'xamut/tmux-network-bandwidth'
set -g @plugin 'tmux-plugins/tmux-online-status'

# Git enhancement
set -g @plugin 'kristijanhusak/tmux-simple-git-status'

# Session management
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin configurations
# Continuum - auto-save every 15 minutes
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# CPU module
set -g @cpu_percentage_format "%3.0f%%"

# Battery module
set -g @batt_icon_status_charged 'CHG'
set -g @batt_icon_status_charging 'CHG'
set -g @batt_icon_status_discharging 'BAT'

# Catppuccin configuration (commented out)
# set -g @catppuccin_gitmux_icon ""
# set -g @catppuccin_gitmux_color "yellow"
# set -g @catppuccin_gitmux_text "#{simple_git_status}"
# set -g @catppuccin_status_modules_right "directory gitmux cpu battery network_bandwidth online_status user date_time"
# set -g @catppuccin_status_modules_left "session"
# set -g @catppuccin_status_left_separator "█"
# set -g @catppuccin_status_right_separator "█"
# set -g @catppuccin_date_time_text "%H:%M"
# set -g @catppuccin_directory_text "#{pane_current_path}"
# set -g @catppuccin_window_left_separator "█"
# set -g @catppuccin_window_right_separator "█ "
# set -g @catppuccin_window_number_position "right"
# set -g @catppuccin_window_middle_separator " | "
# set -g @catppuccin_window_default_fill "none"
# set -g @catppuccin_window_current_fill "all"
# set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag, 🔍,}"
# set -g @catppuccin_window_default_text "#W"

# Rose Pine configuration
set -g @rose_pine_host 'on'
set -g @rose_pine_user 'on'
set -g @rose_pine_directory 'on'
set -g @rose_pine_date_time '%H:%M'

# Custom status modules for Rose Pine
set -g @rose_pine_status_right_append_section '#(cd #{pane_current_path} && git branch --show-current 2>/dev/null) | CPU: #{cpu_percentage} | #{battery_icon} #{battery_percentage}'

# Window configuration
set -g @rose_pine_window_status_separator " | "

# Hide pane borders completely (must be after theme to override)
set -g pane-border-style fg=default,bg=default
set -g pane-active-border-style fg=default,bg=default
set -g pane-border-lines single

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
