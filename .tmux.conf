# Rose Pine configuration
set -g @rose_pine_host 'off'
# The left column repeated the active window name that the window list already
# shows; with every window auto-renamed to 'claude' that read as claude claude.
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_user 'on'
set -g @rose_pine_directory 'on'
set -g @rose_pine_date_time '%H:%M'

# Custom status modules for Rose Pine
set -g @rose_pine_status_right_append_section '#(cd #{pane_current_path} && git branch --show-current 2>/dev/null) | CPU: #{cpu_percentage} #(cat ~/.statmon/temp) | #{battery_icon} #{battery_percentage} | #(cat ~/.statmon/net)'

# Rainbow throbber. A daemon writes frames into @throb_line and forces a status
# redraw, so animating costs nothing extra: the #() commands above stay cached
# on status-interval instead of re-running per frame. Empty when not spawned.
bind T run-shell 'throb --toggle'

# Moving your attention turns the page: focus changes advance the rotation,
# so the thought under the wave tracks where you actually are.
set-hook -g pane-focus-in 'run-shell -b "throb --next"'
set-hook -g after-select-window 'run-shell -b "throb --next"'

# Window configuration
set -g @rose_pine_window_status_separator " | "

# Merge-train popup: latest train beside the whisper feed, auto-dismisses
# when a train completes on its watch
bind M display-popup -w 90% -h 60% -E "train watch --whispers"

# Send a command to all panes in the current window
bind S command-prompt -p "Command:" \
  "run \"tmux list-panes -F '##{session_name}:##{window_index}.##{pane_index}' \
         | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# Hide pane borders completely (must be after theme to override)
set -g pane-border-style fg=default,bg=default
set -g pane-active-border-style fg=default,bg=default
set -g pane-border-lines single

# claude code's process name is its bare version string; show 'claude' instead
set -g automatic-rename-format '#{?#{m:2.*,#{pane_current_command}},claude,#{pane_current_command}}'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# After tpm, so a theme that rewrites status-format can't strand the splice.
# The throbber gets its own centre chunk instead of riding the right column:
# tmux then recentres it in the gap the window list and right column leave,
# per client, on every redraw, including the ones a pane or window switch
# triggers: that is when the directory and branch change the gap's width.
run-shell 'throb --mount'

# --on is a no-op while the daemons live; this revives them after a server crash.
run-shell 'throb --on'
run-shell 'statmon --on'
