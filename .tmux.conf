# Change prefix from Ctrl+b to Ctrl+s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

set -g mouse on
set -g focus-events on
set -ga terminal-overrides ',*256color*:smcup@:rmcup@'
set -g history-limit 100000

# Catppuccin theme (commented out - uncomment to switch back)
# set -g @plugin 'catppuccin/tmux#v2.1.3'
# set -g @catppuccin_flavor 'mocha'

# Rose Pine theme
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main'

# Information modules
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-online-status'

# Git enhancement
set -g @plugin 'kristijanhusak/tmux-simple-git-status'

# Session management
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin configurations
# Continuum - auto-save every 15 minutes
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# CPU module
set -g @cpu_percentage_format "%3.0f%%"

# Battery module
set -g @batt_icon_status_charged 'CHG'
set -g @batt_icon_status_charging 'CHG'
set -g @batt_icon_status_discharging 'BAT'

